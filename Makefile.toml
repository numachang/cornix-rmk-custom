# Local build automation (cargo-make) for the Cornix RMK firmware.
#
#   cargo make uf2     build both halves and emit flashable UF2s into dist/:
#                        central    -> dist/cornix-left.uf2   (left half / USB host)
#                        peripheral -> dist/cornix-right.uf2  (right half)
#   cargo make build   just compile both binaries (release)
#
# Pure-cargo toolchain, no Python / no ARM GNU: cargo-binutils + llvm-tools +
# cargo-hex-to-uf2 + flip-link. Any missing crate/component is installed on the
# first run, so a clean checkout needs only `cargo install cargo-make`.

[config]
default_to_workspace = false
skip_core_tasks = true

[env]
# nrf-sdc-sys' bindgen needs libclang. On Windows default to the usual LLVM
# install unless the caller already set LIBCLANG_PATH; untouched on Linux/CI
# where libclang is found automatically.
LIBCLANG_PATH = { value = "C:\\Program Files\\LLVM\\bin", condition = { platforms = ["windows"], env_not_set = ["LIBCLANG_PATH"] } }

[tasks.install-llvm-tools]
install_crate = { rustup_component_name = "llvm-tools" }

[tasks.flip-link]
install_crate = { crate_name = "flip-link", binary = "flip-link", test_arg = ["-h"] }

[tasks.build]
description = "Compile central + peripheral (release)."
dependencies = ["flip-link"]
command = "cargo"
args = ["build", "--release", "--bin", "central", "--bin", "peripheral"]

[tasks.dist-dir]
private = true
script_runner = "@duckscript"
script = "mkdir dist"

# --- central -> cornix-left ---
[tasks.hex-left]
private = true
dependencies = ["install-llvm-tools", "build"]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = ["objcopy", "--help"] }
command = "cargo"
args = ["objcopy", "--release", "--bin", "central", "--", "-O", "ihex", "target/cornix-left.hex"]

[tasks.uf2-left]
private = true
dependencies = ["hex-left", "dist-dir"]
install_crate = { crate_name = "cargo-hex-to-uf2", binary = "cargo", test_arg = ["hex-to-uf2", "--help"] }
command = "cargo"
args = ["hex-to-uf2", "--input-path", "target/cornix-left.hex", "--output-path", "dist/cornix-left.uf2", "--family", "nrf52840"]

# --- peripheral -> cornix-right ---
[tasks.hex-right]
private = true
dependencies = ["install-llvm-tools", "build"]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = ["objcopy", "--help"] }
command = "cargo"
args = ["objcopy", "--release", "--bin", "peripheral", "--", "-O", "ihex", "target/cornix-right.hex"]

[tasks.uf2-right]
private = true
dependencies = ["hex-right", "dist-dir"]
install_crate = { crate_name = "cargo-hex-to-uf2", binary = "cargo", test_arg = ["hex-to-uf2", "--help"] }
command = "cargo"
args = ["hex-to-uf2", "--input-path", "target/cornix-right.hex", "--output-path", "dist/cornix-right.uf2", "--family", "nrf52840"]

[tasks.uf2]
description = "Build both halves and write dist/cornix-{left,right}.uf2."
dependencies = ["uf2-left", "uf2-right"]

[tasks.default]
alias = "uf2"

# ---------------------------------------------------------------------------
# Storage-reset images.
#
#   cargo make uf2-reset   build one-shot "factory reset" UF2s into dist/:
#                            dist/cornix-left-reset.uf2
#                            dist/cornix-right-reset.uf2
#
# These are identical to the normal firmware except `clear_storage = true`, so
# they WIPE the on-flash config/bond storage on every boot. Use them once to
# clean stale storage (e.g. after running another firmware, or when the layout
# dimensions / storage format changed), then re-flash the normal images:
#
#   1. flash *-reset.uf2 to the relevant half/halves
#   2. power on, let it boot once (this erases the storage sectors)
#   3. flash the normal cornix-{left,right}.uf2 again
#
# Do NOT keep a reset image as your daily firmware: it would erase your Vial
# customisations and BLE bonds on every power cycle.
#
# Implementation notes:
#  - keyboard.reset.toml is generated from keyboard.toml (single source of
#    truth; only `clear_storage` is flipped), so the two never drift.
#  - the reset build uses an isolated CARGO_TARGET_DIR (target/reset) so the
#    new toml is guaranteed to be re-expanded by the rmk macro and the normal
#    dist/ artifacts are never touched.

[tasks.gen-reset-toml]
private = true
script_runner = "@duckscript"
script = '''
content = readfile keyboard.toml
content = replace ${content} "clear_storage = false" "clear_storage = true"
writefile keyboard.reset.toml ${content}
echo generated keyboard.reset.toml (clear_storage = true)
'''

[tasks.build-reset]
private = true
dependencies = ["gen-reset-toml", "flip-link"]
command = "cargo"
args = ["build", "--release", "--bin", "central", "--bin", "peripheral"]
env = { KEYBOARD_TOML_PATH = "${CARGO_MAKE_WORKING_DIRECTORY}/keyboard.reset.toml", CARGO_TARGET_DIR = "target/reset" }

[tasks.hex-left-reset]
private = true
dependencies = ["install-llvm-tools", "build-reset"]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = ["objcopy", "--help"] }
command = "cargo"
args = ["objcopy", "--release", "--bin", "central", "--", "-O", "ihex", "target/reset/cornix-left-reset.hex"]
env = { KEYBOARD_TOML_PATH = "${CARGO_MAKE_WORKING_DIRECTORY}/keyboard.reset.toml", CARGO_TARGET_DIR = "target/reset" }

[tasks.uf2-left-reset]
private = true
dependencies = ["hex-left-reset", "dist-dir"]
install_crate = { crate_name = "cargo-hex-to-uf2", binary = "cargo", test_arg = ["hex-to-uf2", "--help"] }
command = "cargo"
args = ["hex-to-uf2", "--input-path", "target/reset/cornix-left-reset.hex", "--output-path", "dist/cornix-left-reset.uf2", "--family", "nrf52840"]

[tasks.hex-right-reset]
private = true
dependencies = ["install-llvm-tools", "build-reset"]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = ["objcopy", "--help"] }
command = "cargo"
args = ["objcopy", "--release", "--bin", "peripheral", "--", "-O", "ihex", "target/reset/cornix-right-reset.hex"]
env = { KEYBOARD_TOML_PATH = "${CARGO_MAKE_WORKING_DIRECTORY}/keyboard.reset.toml", CARGO_TARGET_DIR = "target/reset" }

[tasks.uf2-right-reset]
private = true
dependencies = ["hex-right-reset", "dist-dir"]
install_crate = { crate_name = "cargo-hex-to-uf2", binary = "cargo", test_arg = ["hex-to-uf2", "--help"] }
command = "cargo"
args = ["hex-to-uf2", "--input-path", "target/reset/cornix-right-reset.hex", "--output-path", "dist/cornix-right-reset.uf2", "--family", "nrf52840"]

[tasks.uf2-reset]
description = "Build one-shot storage-reset images (dist/cornix-{left,right}-reset.uf2)."
dependencies = ["uf2-left-reset", "uf2-right-reset"]
