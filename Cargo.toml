[package]
name = "cornix-rmk-custom"
version = "0.1.0"
description = "Unofficial custom RMK firmware for the Cornix split keyboard (nRF52840, BLE)"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# Pinned to our fork of rmk `main` (upstream 6465fedf + one fix) until the fix
# lands upstream: a never-enumerated USB device (charge-only cable / wall
# charger) was published as Suspended, which counts as usb_ready() and routed
# all reports to a dead USB transport instead of BLE. Fork branch:
# https://github.com/numachang/rmk/tree/fix/never-configured-usb-suspend
# The 0.8.x releases still lack the tap-hold / morse fix series, so we stay on
# the development line. Bump the rev deliberately, not automatically.
rmk = { git = "https://github.com/numachang/rmk", rev = "7b64b68ab26c8ad88a348a272db9d19322cdab62", features = [
    "nrf52840_ble",
    "split",
    "async_matrix",
    "adafruit_bl",
] }
# nrf-sdc / nrf-mpsl must come from the same source rmk's BLE stack is built
# against (matching bt-hci 0.9), otherwise the SoftDevice controller types don't
# line up with trouble-host.
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "abe49d22ebfc85fae134eb082fbfddf752016a55", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "abe49d22ebfc85fae134eb082fbfddf752016a55", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.9", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
embedded-hal = "1.0"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
