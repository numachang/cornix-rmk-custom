[package]
name = "cornix-rmk-custom"
version = "0.1.0"
description = "Unofficial custom RMK firmware for the Cornix split keyboard (nRF52840, BLE)"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# Pinned to a specific rmk `main` revision. The 0.8.x releases carry a series of
# tap-hold / morse bugs that are only fully fixed on the development line (plus
# split/BLE robustness fixes our setup benefits from), and none of those are in
# a published release. Bump the rev deliberately, not automatically.
rmk = { git = "https://github.com/HaoboGu/rmk", rev = "f8db944df47101d03d8cfe01906ec5c3d37eed36", features = [
    "nrf52840_ble",
    "split",
    "async_matrix",
    "adafruit_bl",
] }
# nrf-sdc / nrf-mpsl must come from the same fork rmk's BLE stack is built
# against (matching bt-hci 0.8), otherwise the SoftDevice controller types don't
# line up with trouble-host.
nrf-sdc = { git = "https://github.com/haobogu/nrf-sdc", rev = "ffe59a7aefaaa145a3d2474602f33387f80dcefa", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/haobogu/nrf-sdc", rev = "ffe59a7aefaaa145a3d2474602f33387f80dcefa", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.8", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.10", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
embedded-hal = "1.0"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"

rand = { version = "0.8.4", default-features = false }
rand_core = { version = "0.6" }
rand_chacha = { version = "0.3", default-features = false }

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
