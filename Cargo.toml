[package]
name = "cornix-rmk-custom"
version = "0.1.0"
description = "Unofficial custom RMK firmware for the Cornix split keyboard (nRF52840, BLE)"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
rmk = { version = "0.8", features = [
    "nrf52840_ble",
    "split",
    "async_matrix",
    "adafruit_bl",
] }
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "11d5c3c", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "11d5c3c", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.6", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.8", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.9", features = [
    "defmt",
    "arch-cortex-m",
    "executor-thread",
] }
embedded-hal = "1.0"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"

rand = { version = "0.8.4", default-features = false }
rand_core = { version = "0.6" }
rand_chacha = { version = "0.3", default-features = false }

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"

# Local rmk 0.8.2 with the tap-hold "enable rolls on permissive_hold /
# hold_on_other_press" fix (rmk #743) cherry-picked. Same deps as crates.io
# 0.8.2; only rmk/src/keyboard.rs differs.
#
# `vendor/rmk/` is gitignored (it's just upstream rmk 0.8.2). To recreate it
# after a fresh clone, before building:
#   1. cargo fetch                       # ensure rmk 0.8.2 is in the registry cache
#   2. copy <cargo cache>/rmk-0.8.2/ -> vendor/rmk/   (and clear read-only attrs)
#   3. git apply patches/rmk-0.8.2-743-tap-hold.patch
# This is a stopgap; the real fix is migrating to rmk main (tracked on a branch).
[patch.crates-io]
rmk = { path = "vendor/rmk" }
