name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed for the tag-triggered release step to create a GitHub Release and
# upload the UF2 assets. Only consequential on tag pushes (see the `if` below).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (for nrf-sdc bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Install cargo-make
        run: cargo install cargo-make

      - name: Build UF2 (cargo make)
        # cargo-make installs flip-link, cargo-binutils + llvm-tools and
        # cargo-hex-to-uf2 on first use, then emits dist/cornix-{left,right}.uf2.
        run: cargo make uf2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cornix-firmware
          path: |
            target/thumbv7em-none-eabihf/release/central
            target/thumbv7em-none-eabihf/release/peripheral
            dist/cornix-left.uf2
            dist/cornix-right.uf2

      # On a `v*` tag push, publish a GitHub Release with the flashable UF2s
      # attached, so each tagged version has durable, downloadable firmware.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/cornix-left.uf2
            dist/cornix-right.uf2
